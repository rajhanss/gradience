# Local Dev Orchestration for Gradience
# Built for FortyGuard Global AI Hackathon 2026
name: gradience

services:
  # FastAPI Backend Service
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      GRADIENCE_ENV: development
      ENVIRONMENT: development
      FORTYGUARD_BASE_URL: ${FORTYGUARD_BASE_URL:-https://api.fortyguard.com}
      FORTYGUARD_API_KEY: ${FORTYGUARD_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}          # Optional: Groq LLM assistant key
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY:-}  # Optional: Climate search key
      GRADIENCE_CORS_ORIGINS: ${GRADIENCE_CORS_ORIGINS:-http://localhost:3000,http://localhost:8080}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  # React 19 Frontend Web Service (Nginx Proxy)
  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
    ports:
      - "3000:80"
      - "8080:80"
    environment:
      API_UPSTREAM: http://api:8000
      PORT: 80
    depends_on:
      api:
        condition: service_healthy
